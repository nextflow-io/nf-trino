plugins {
    id 'io.nextflow.nextflow-plugin' version '0.0.1-alpha4'
}

version = '0.1.0'

nextflowPlugin {
    nextflowVersion = '24.10.0'

    provider = 'nextflow'
    className = 'nextflow.plugin.NfTrinoPlugin'
    extensionPoints = [
        'nextflow.sql.ChannelSqlExtension'
    ]

    publishing {
        registry {
            url = 'https://nf-plugins-registry.dev-tower.net/api'
            authToken = project.findProperty('pluginRegistry.accessToken')
        }
    }
}

dependencies {
    api("org.apache.groovy:groovy-sql:4.0.26") { transitive = false }
    api("io.nextflow:nf-sqldb:0.7.0") { transitive = false }
}