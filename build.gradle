plugins {
    id 'io.nextflow.nextflow-plugin' version '0.0.1-alpha4'
    id 'de.undercouch.download' version '5.4.0'
}

version = '0.1.0'



nextflowPlugin {
    nextflowVersion = '24.10.0'

    provider = 'nextflow'
    className = 'nextflow.plugin.NfTrinoPlugin'
    extensionPoints = [
        'nextflow.sql.ChannelSqlExtension'
    ]

    publishing {
        registry {
            url = 'https://nf-plugins-registry.dev-tower.net/api'
            authToken = project.findProperty('pluginRegistry.accessToken')
        }
    }
}

dependencies {
    api("org.apache.groovy:groovy-sql:4.0.26") { transitive = false }
    api("io.nextflow:nf-sqldb:0.7.0") { transitive = false }
    
    // Trino JDBC driver from Maven Central
    // Reference https://trino.io/docs/current/client/jdbc.html
    api("io.trino:trino-jdbc:476")
    
    // AWS Athena JDBC driver - downloaded via task below
    // Reference https://docs.aws.amazon.com/athena/latest/ug/connect-with-jdbc.html
    api files('src/dist/lib/AthenaJDBC42-2.2.1.1001.jar')
    
    // Testcontainers for integration testing
    testImplementation("org.testcontainers:testcontainers:1.20.0")
    testImplementation("org.testcontainers:trino:1.20.0")
    testImplementation("org.testcontainers:spock:1.20.0")
}

/**
 * AWS Athena JDBC Driver Download
 * Downloads the latest Athena JDBC driver directly from AWS
 * Reference: https://docs.aws.amazon.com/athena/latest/ug/connect-with-jdbc.html
 */
task downloadAthenaDriver(type: Download) {
    src 'https://s3.amazonaws.com/athena-downloads/drivers/JDBC/SimbaAthenaJDBC-2.2.1.1001/AthenaJDBC42-2.2.1.1001.jar'
    dest 'src/dist/lib/AthenaJDBC42-2.2.1.1001.jar'
    overwrite false
    onlyIfModified true
}

// Ensure the Athena driver is downloaded before compilation
project.compileGroovy.dependsOn('downloadAthenaDriver')
