name: Test Examples

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "src/**"
      - "build.gradle"
  pull_request:
    branches: [main]
    paths:
      - "tests/**"
      - "src/**"
      - "build.gradle"

jobs:
  test-examples:
    name: Test examples with nf-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow: ["24.04", "24.10", "25.04"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Nextflow ${{ matrix.nextflow }}
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow }}

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Install plugin
        run: make install

      - name: Run all example tests
        run: make test-examples
